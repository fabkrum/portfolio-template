name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      # Includes the Check against the sample site and every broken fixture site,
      # in the runner's own Chrome.
      - name: Tests (renderer and Check)
        run: node --test
      - name: Content file matches the schema
        shell: bash
        run: bash tests/validate-content.sh
      - name: The Check on the sample site, as a participant sees it
        run: node tools/check.mjs
      # Later tickets add: install scripts, shellcheck, PSScriptAnalyzer.
